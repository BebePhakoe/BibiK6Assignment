name: Performance Test

on:
  push:
    branches: [ master ]
  workflow_dispatch: 

jobs:
  k6_test:
    name: Run k6 Performance Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run k6 test
        uses: grafana/k6-action@v0.3.1
        with:
          # This tells GitHub to enter your project folder first
          directory: ./BibiK6Assignment
          # This points to the test file inside that folder
          filename: Tests/logintest.js